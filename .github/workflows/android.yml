name: GradenTranslator Android Build

on:
  push:
    branches:
      - main
    paths:
      - 'GradenTranslator-cloud-build-source/**'
      - '.github/workflows/android.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'GradenTranslator-cloud-build-source/**'
      - '.github/workflows/android.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: GradenTranslator-cloud-build-source

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Verify build toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: GradenTranslator-debug
          path: GradenTranslator-cloud-build-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
